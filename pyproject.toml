[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spedas-agent-kit"
version = "0.1.0"
description = "Unified SPEDAS-oriented MCP server for CDAWeb, PDS PPI, and SPICE workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zesen Huang" },
]
keywords = ["spedas", "heliophysics", "cdaweb", "pds", "spice", "mcp", "space-physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "spiceypy>=6.0.0,<8.1.1; python_version == '3.10'",
    "spiceypy>=6.0.0; python_version >= '3.11'",
    "cdflib>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "mcp>=1.26.0,<2",

]

[project.optional-dependencies]
mcp = ["mcp>=1.26.0,<2"]
dev = [
    "pytest>=7.0",
    "mcp>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/spedas/spedas_agent_kit"
Repository = "https://github.com/spedas/spedas_agent_kit"
Issues = "https://github.com/spedas/spedas_agent_kit/issues"

[project.scripts]
spedas-agent-kit = "spedas_agent_kit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spedas_agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
